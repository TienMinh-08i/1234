[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marshmallow-data-prep"
version = "0.1.0"
description = "Independent offline Marshmallow dataset and mutant preparation"
requires-python = ">=3.11"
dependencies = ["pytest==8.4.2", "simplejson==3.20.2", "tzdata==2025.2"]

[project.scripts]
mm-data-prep = "mm_data_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
